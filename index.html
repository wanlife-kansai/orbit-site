<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ORBIT｜トップ</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#1A2440}
a{color:#FFFFFF}a:hover{color:#E3E7EE}
@keyframes orbitFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.orbit-in{animation:orbitFade 1.2s ease-out both}
.orbit-in-2{animation:orbitFade 1.2s ease-out .35s both}
.orbit-btn{transition:background-color .3s ease,color .3s ease}
.orbit-btn-solid:hover{background:#E3E7EE !important}
.orbit-btn-line:hover{background:rgba(255,255,255,0.12) !important}
@media (prefers-reduced-motion: reduce){.orbit-in,.orbit-in-2{animation:none}}
</style>

</head>
<body>


<div style="position: relative; width: 100%; height: 100vh; min-height: 640px; overflow: hidden; background: #1A2440; color: #FFFFFF; font-family: 'Noto Sans JP', system-ui, sans-serif">

<img src="/images/top.jpg" alt="ガラスの輪が重なり合うORBITのメインビジュアル" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 35% center">
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(20,28,54,0.62) 0%, rgba(20,28,54,0.3) 60%, rgba(20,28,54,0) 100%)" aria-hidden="true"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(to top, rgba(20,28,54,0.6), rgba(20,28,54,0))" aria-hidden="true"></div>

<div style="position: absolute; top: 0; left: 0; right: 0; padding: 28px 32px; display: flex; align-items: center; gap: 10px">
<svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"></circle><ellipse cx="17" cy="17" rx="15" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(-25 17 17)"></ellipse><circle cx="17" cy="17" r="4.5" fill="#FFFFFF"></circle></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.12em">ORBIT</span>
</div>

<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 96px 24px 72px; box-sizing: border-box">
<div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">
<h1 class="orbit-in" style="margin: 0; font-size: clamp(30px, 4.6vw, 58px); line-height: 1.4; font-weight: 700; letter-spacing: 0.04em"><span style="display: block; white-space: nowrap">店舗の情報を、</span><span style="display: block; white-space: nowrap">ひとつの軌道に。</span></h1>
<p class="orbit-in-2" style="margin: 0; font-size: 15px; line-height: 1.9; letter-spacing: 0.04em; color: #D5DBE5">複数サイトの管理、業務効率UPのお手伝いをいたします。</p>
<div class="orbit-in-2" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 12px">
<a href="/detail/" class="orbit-btn orbit-btn-solid" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; background: #FFFFFF; color: #1A2440; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; padding: 16px 34px; border-radius: 999px">詳細を見る
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
<a href="/detail/#contact" class="orbit-btn orbit-btn-line" style="display: inline-flex; align-items: center; text-decoration: none; border: 1px solid rgba(255,255,255,0.75); color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; padding: 15px 34px; border-radius: 999px">お問い合わせ</a>
</div>
</div>
</div>

</div>

</body>
</html>
